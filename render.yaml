databases:
  - name: light-crm-db
    plan: free
    databaseName: whatsapp_crm
    user: whatsapp_crm_user

services:
  - type: web
    name: light-crm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: (node dist/seed.js || echo "seed skipped") && npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATOR_INTERVAL_MS
        value: 0
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: light-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: light-crm-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: light-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: light-crm-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: light-crm-db
          property: database
