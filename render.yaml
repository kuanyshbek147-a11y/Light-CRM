databases:
  - name: light-crm-db
    plan: free
    databaseName: whatsapp_crm
    user: whatsapp_crm_user

services:
  - type: web
    name: light-crm-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && cd ../frontend && npm install --include=dev && VITE_API_URL=/api VITE_PUBLIC_WEBHOOK_BASE_URL=https://light-crm-backend.onrender.com npm run build && rm -rf ../backend/public && mkdir -p ../backend/public && cp -r dist/. ../backend/public/
    startCommand: (node dist/seed.js || echo "seed skipped") && npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: SIMULATOR_INTERVAL_MS
        value: 0
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_ID
        value: "2788233571542840"
      - key: WHATSAPP_VERIFY_TOKEN
        value: lightcrm-meta-verify-2026
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID
        value: "859655197221237"
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        value: "2252824615477997"
      - key: SUPER_ADMIN_LOGIN
        value: superadmin
      - key: SUPER_ADMIN_EMAIL
        value: platform@lightcrm.local
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://light-crm-backend.onrender.com
      - key: INSTAGRAM_PAGE_ID
        sync: false
      - key: INSTAGRAM_PAGE_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_IG_USER_ID
        sync: false
      - key: INSTAGRAM_API_VERSION
        value: v21.0
      - key: DB_HOST
        fromDatabase:
          name: light-crm-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: light-crm-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: light-crm-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: light-crm-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: light-crm-db
          property: database
