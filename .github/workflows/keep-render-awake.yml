# Ping Render free tier so the backend does not sleep between visits.
name: Keep Render awake

on:
  schedule:
    # Every 10 minutes — free Render spins down after ~15 min idle.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake light-crm-backend
        run: |
          set -e
          for i in 1 2 3; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 90 \
              "https://light-crm-backend.onrender.com/health" || echo "000")
            echo "attempt=$i http=$code body=$(cat /tmp/health.json 2>/dev/null || true)"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "health check failed after retries"
          exit 1
