# Сборка Android-приложения (APK) — без Android Studio и Windows.
# Готовый файл: вкладка Actions → этот запуск → Artifacts → LightCRM-android.
# Приложение — оболочка Capacitor над https://light-crm-kz.netlify.app, поэтому новые функции сайта
# появляются в нём без пересборки; пересобирать нужно только при изменениях в mobile/.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-apk.yml"

concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm ci

      - name: Android-проект Capacitor
        run: |
          npx cap add android
          node scripts/prepare-android-ci.mjs

      - name: Иконка приложения
        run: |
          npm install --no-save sharp
          node scripts/generate-launcher-icons.js

      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LightCRM-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
