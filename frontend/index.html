<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5b5ce9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#5b5ce9" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Light CRM — чаты, сделки и маркетинг" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Light CRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Light CRM</title>
  </head>
  <body>
    <div id="root">
      <div style="margin: 24px; font-family: system-ui, sans-serif; color: #475569; max-width: 28rem">
        <p style="margin: 0 0 8px; font-size: 1.05rem; font-weight: 600; color: #0f172a">Загрузка Light CRM…</p>
        <p style="margin: 0; font-size: 0.9rem; line-height: 1.45">
          Если открываете впервые за несколько минут — сервер может «просыпаться» 30–60 секунд. Обновите страницу, если загрузка затянулась.
        </p>
      </div>
    </div>
    <noscript>
      <p style="margin: 24px; font-family: system-ui, sans-serif">Для работы Light CRM нужен JavaScript.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
