[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "/api"
  VITE_PUBLIC_WEBHOOK_BASE_URL = "https://light-crm-backend.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://light-crm-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://light-crm-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
