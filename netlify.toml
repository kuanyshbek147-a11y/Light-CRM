[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_API_URL = "https://light-crm-backend.onrender.com/api"
  VITE_PUBLIC_WEBHOOK_BASE_URL = "https://light-crm-backend.onrender.com"
  VITE_DEMO_WHATSAPP = "77003131055"

[[redirects]]
  from = "/api/*"
  to = "https://light-crm-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://light-crm-backend.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/help/*"
  to = "https://light-crm-backend.onrender.com/help/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/kb/*"
  to = "https://light-crm-backend.onrender.com/help/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
