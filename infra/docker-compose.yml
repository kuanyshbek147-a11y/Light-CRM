services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_crm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    env_file:
      - .env
      - meta.secrets.env
    environment:
      PORT: 4000
      JWT_SECRET: dev-secret
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: whatsapp_crm
      SIMULATOR_INTERVAL_MS: ${SIMULATOR_INTERVAL_MS:-0}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-telegram-dev-secret}
      TELEGRAM_DELIVERY_MODE: ${TELEGRAM_DELIVERY_MODE:-webhook}
      EMAIL_CREDENTIALS_KEY: ${EMAIL_CREDENTIALS_KEY:-a9bb135d09f079e20412da0706048cc7a89595f2a7f4a3ca2456c65b75f8f96b}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  seed:
    build:
      context: ../backend
    command: ["npm", "run", "seed"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: whatsapp_crm
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_URL: http://localhost:4000/api
        VITE_PUBLIC_WEBHOOK_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
    ports:
      - "5173:80"
    depends_on:
      - backend
